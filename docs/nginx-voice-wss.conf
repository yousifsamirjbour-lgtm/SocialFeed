# ==============================================================================
# Nginx Configuration Snippet for Joupro Realtime Voice Agent WebSocket (WSS)
# ==============================================================================
# Place this configuration inside the HTTPS server { ... } block on the EC2 host:
# /etc/nginx/sites-available/socialfeed or /etc/nginx/conf.d/socialfeed.conf
# ==============================================================================

# 1. Connection Upgrade Mapping (place outside server block in http context if not already present)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. WebSocket Reverse-Proxy Directive for Voice Mode
# Endpoint: /api/voice/stream
location /api/voice/stream {
    proxy_pass http://127.0.0.1:8000/api/voice/stream;
    proxy_http_version 1.1;

    # Mandatory WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Client IP and host forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable proxy buffering for zero latency real-time streaming
    proxy_buffering off;

    # Long timeout for continuous voice conversations (up to 24 hours)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
